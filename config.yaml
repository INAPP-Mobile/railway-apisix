apisix:
  node_listen:
    - port: 9080
  enable_admin: true

deployment:
  role: traditional
  config_provider: yaml
  role_traditional:
    config_provider: yaml
  etcd:
    host:
      - "http://127.0.0.1:2379"
    prefix: /apisix
    timeout: 30
  admin:
    admin_listen:
      port: 9180
    admin_key:
      - name: admin
        key: edd1c9f034335f136f87ad84b625c8f1
        role: admin
