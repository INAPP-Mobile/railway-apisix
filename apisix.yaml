routes:
  - uri: /health
    upstream:
      nodes:
        "127.0.0.1:9080": 1
      type: roundrobin
    plugins:
      response-rewrite:
        status_code: 200
        body: "ok"
  - uri: /*
    upstream:
      nodes:
        "127.0.0.1:9080": 1
      type: roundrobin
    plugins:
      response-rewrite:
        status_code: 200
        body: "ok"
#END
